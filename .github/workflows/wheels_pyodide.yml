name: Build python-libsbml Wheel (pyodide)

on:
  workflow_dispatch:
  
jobs:
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Optional, use if you use setuptools_scm
        
    - name: checkout needed submodules
      shell: bash
      run: |
        ./.github/workflows/checkout-submodules.sh

    - name: Build SDist
      run: pipx run build --sdist

    - uses: actions/upload-artifact@v4
      with:
        path: dist/*.tar.gz
        name: libSBML-sdist
  
  build_wheels:
    name: Wheel on ${{ matrix.os }}
    runs-on: ubuntu-latest
    needs: make_sdist

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libSBML-sdist

      - name: Extract sdist into the current directory
        shell: bash
        run: |
          tar zxf *.tar.gz --strip-components=1


      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel swig cmake
  
          # print versions
          python --version
          cmake --version
          swig -version

      - name: Build Wheels
        run: |
          python -m cibuildwheel --output-dir wheelhouse
        env:
            CIBW_PLATFORM: pyodide
            CIBW_BEFORE_BUILD_LINUX: "pip install -U swig"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          path: wheelhouse/*.whl
          name: libSBML-pyodide
